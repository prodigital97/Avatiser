name: import media from google drive

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "Public Google Drive folder link ('anyone with the link')"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install gdown + ffmpeg (ffprobe ships with ffmpeg)
        run: |
          pip install --quiet gdown
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Download the shared folder
        run: |
          mkdir -p /tmp/incoming
          gdown --folder "${{ inputs.folder_url }}" -O /tmp/incoming
          echo "--- downloaded ---"
          find /tmp/incoming -type f -exec ls -la {} \;

      - name: Compress videos, copy images, write a draft manifest
        run: |
          set -e
          DEST=site/assets/work/_incoming
          mkdir -p "$DEST"
          python3 - <<'PYEOF'
          import json, os, re, subprocess, shutil

          SRC = "/tmp/incoming"
          DEST = "site/assets/work/_incoming"
          VIDEO_EXT = {".mp4", ".mov", ".m4v", ".webm", ".avi", ".mkv"}
          IMAGE_EXT = {".jpg", ".jpeg", ".png", ".webp"}

          # already integrated on an earlier pass (site/assets/videos/clip1,2,4) -- skip re-processing
          ALREADY_DONE = {
              "hf_20260415_231212_407a57e9-c464-4df3-a7df-5961fadaac21 (1).mp4",
              "hf_20260417_082144_1af7bb5d-2af1-4e3b-865e-9a0d2fdf327b (1).mp4",
              "hf_20260618_222800_4d7a1b82-daaa-415c-9573-21637e905c4f.mp4",
          }

          def slug(name):
              base, ext = os.path.splitext(name)
              base = re.sub(r"[^a-zA-Z0-9]+", "-", base).strip("-").lower()
              return (base or "file"), ext.lower()

          entries = []
          for root, _, files in os.walk(SRC):
              for f in files:
                  if f in ALREADY_DONE:
                      entries.append({"original": f, "type": "skipped-duplicate"})
                      continue
                  path = os.path.join(root, f)
                  base, ext = slug(f)
                  if ext in VIDEO_EXT:
                      out_name = base + ".mp4"
                      out_path = os.path.join(DEST, out_name)
                      # probe orientation to pick a sane scale target
                      probe = subprocess.run(
                          ["ffprobe","-v","error","-select_streams","v:0",
                           "-show_entries","stream=width,height",
                           "-of","csv=p=0", path],
                          capture_output=True, text=True)
                      w, h = (9999, 9999)
                      try:
                          w, h = map(int, probe.stdout.strip().split(","))
                      except Exception:
                          pass
                      scale = "scale=720:-2" if h >= w else "scale=1280:-2"
                      subprocess.run(["ffmpeg","-y","-i", path, "-vf", scale,
                                       "-c:v","libx264","-crf","26","-preset","slow",
                                       "-pix_fmt","yuv420p","-movflags","+faststart",
                                       "-an", out_path], check=True)
                      poster_name = base + "-poster.jpg"
                      poster_path = os.path.join(DEST, poster_name)
                      subprocess.run(["ffmpeg","-y","-ss","1","-i", out_path,
                                       "-frames:v","1","-q:v","4", poster_path], check=True)
                      entries.append({"original": f, "type": "video",
                                       "src": f"/assets/work/_incoming/{out_name}",
                                       "poster": f"/assets/work/_incoming/{poster_name}",
                                       "orientation": "portrait" if h >= w else "landscape"})
                  elif ext in IMAGE_EXT:
                      out_name = base + ext
                      out_path = os.path.join(DEST, out_name)
                      shutil.copyfile(path, out_path)
                      entries.append({"original": f, "type": "image",
                                       "src": f"/assets/work/_incoming/{out_name}"})
                  else:
                      entries.append({"original": f, "type": "skipped-unknown-type"})

          with open(os.path.join(DEST, "manifest-draft.json"), "w") as fh:
              json.dump({"imported": entries}, fh, indent=2)
          print(json.dumps(entries, indent=2))
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add site/assets/work/_incoming
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Import + compress media from shared Drive folder (automated)"
            git push
          fi
